; Sound definitions of the asset generator (generator "sounds").
; Own interpretations of the game events: each section is a short synth recipe
; (format of fpcTesttone / uag_sound). Drafted by tools/wav2ini from coarse
; features (length, loudness, brightness, pitch level) and refined by hand.
; Spoken sounds are own phrases. After a change: wav2ini --inc sounds.ini uag_sounds_ini.inc
;
; welle t=.. len=.. f=.. vol=.. attack=.. curve=.. duty=.. vib=.. rep=.. ring=.. f1=.. f2=.. f3=.. bw=.. lp=..
; (description of the fields: asset_generator/uag_sound.pas; lp = low pass, an extension that
; fpcTesttone ignores). Section name = file name of the game (sounds/, menuexit + quitgame: res/).
; "measured" lines: the coarse features of the original the draft was derived from (env = level
; in dB at ms, at most 8 points; onsets = count and times of hits).

