; Music of the asset generator (generator "sounds"): own compositions for the
; menu screens, rendered by the step sequencer of uag_sound (format described
; in asset_generator/uag_sound.pas, names are not case sensitive). After a change:
;   wav2ini --inc music.ini uag_music_ini.inc
; Listen without the generator: wav2ini --music music.ini <out dir>
;
; [song:name]   tempo, instruments, patterns, parts and order of one piece
; [music:file]  the file res/<file>.wav, rendered from song=<name>; tempo=,
;               key= and order= change the song for this file only

[song:menu]
; "Short Fuse": own upbeat chiptune / synth pop tune, written in C major and
; played in D major (key=2). 128 bpm, 16th note steps, 16 bars = 30 s:
; intro (2) - A (4) - A2 (4) - B (4) - tag (2), the tag leads back to the intro.
bpm=128
beat=4
key=2
rms=0.15
loop=1

; drums (hits: f in Hz)
inst kick  = sine  len=150 f=160..42 vol=0.32 attack=1 curve=1.4
inst kick  = noise len=10 f=22050 vol=0.12 curve=2 lp=2500
inst snare = noise len=170 f=22050 vol=0.30 attack=1 curve=2.2 lp=8000..2500
inst snare = triangle len=70 f=240..170 vol=0.22 attack=1 curve=1.5
inst hat   = noise len=35 f=22050 vol=0.13 attack=1 curve=2.5
; tones (notes: f is a factor of the note frequency)
inst bass  = triangle vol=0.25 attack=2 curve=0.4 gate=0.8
inst bass  = square vol=0.05 duty=0.5 attack=2 curve=0.8 lp=700
inst arp   = square vol=0.09 duty=0.125 attack=1 curve=1.6 lp=3500 gate=0.9
inst pad   = saw vol=0.045 attack=90 curve=0 lp=1400 vib=4,0.004 gate=1
inst pad   = saw f=1.006 vol=0.045 attack=90 curve=0 lp=1400
inst lead  = square vol=0.15 duty=0.25 attack=4 curve=0.5 vib=5.5,0.006 lp=5000 gate=0.92 echo=3,0.28
inst lead  = square f=2.003 vol=0.03 duty=0.5 attack=4 curve=0.8 lp=6000

; drum patterns, one bar
pat four   = x . . . x . . . x . . . x . . .
pat synco  = x . . . . . . x . . x . . . . .
pat back   = . . . . x . . . . . . . x . . .
pat fill   = . . . . x . . . . . x . x x X X
pat hats   = . . x . . . x . . . x . . . x .
pat hats16 = o o x o o o x o o o x o o o x o
pat tagsn  = @back @fill

; bass: octave bounce in 8ths, moved to the chord roots
pat bC     = C2 . C3 . C2 . C3 . C2 . C3 . C2 . C3 .
pat bassI  = @bC @bC+7
pat bassA  = @bC @bC+7 @bC+9 @bC+5
pat bassB  = @bC+9 @bC+5 @bC @bC+7
pat bassT  = @bC+5 @bC+7

; arpeggios (16ths): major and minor chord, moved to the chords
pat arpMaj = C4 E4 G4 C5 C4 E4 G4 C5 C4 E4 G4 C5 C4 E4 G4 C5
pat arpMin = A3 C4 E4 A4 A3 C4 E4 A4 A3 C4 E4 A4 A3 C4 E4 A4
pat arpI   = @arpMaj @arpMaj-5
pat arpA   = @arpMaj @arpMaj-5 @arpMin @arpMaj-7
pat arpT   = @arpMaj-7 @arpMaj-5

; pad of the bridge: two held voices
pat hold   = C4 - - - - - - - - - - - - - - -
pat padHi  = @hold+4 @hold+5 @hold+4 @hold+2
pat padLo  = @hold @hold-3 @hold-5 @hold-1

; melody, chords C G Am F (A, A2) and Am F C G (B)
pat leadA  = E5 - G5 - C6 - - - B5 - G5 - E5 - D5 - |
pat leadA  = D5 - - - G5 - - . B5 - A5 - G5 - D5 - |
pat leadA  = E5 - - - A5 - - . C6 - B5 - A5 - E5 - |
pat leadA  = F5 - - - A5 - G5 - F5 - E5 - D5 - C5 -
pat leadA2 = E5 - G5 - C6 - - - D6 - C6 - G5 - E5 - |
pat leadA2 = D5 - - - G5 - - . B5 - D6 - B5 - G5 - |
pat leadA2 = C6 - - - A5 - - . E5 - A5 - C6 - E6 - |
pat leadA2 = F6 - - - E6 - - - C6 - - - A5 - G5 -
pat leadB  = A5 . A5 . C6 - A5 . G5 - E5 - - - . . |
pat leadB  = F5 . F5 . A5 - F5 . E5 - C5 - - - . . |
pat leadB  = E5 . E5 . G5 - E5 . D5 - C5 - D5 - E5 - |
pat leadB  = D5 - - - G5 - - - B5 - - - D6! - - -
pat leadT  = C6 - A5 - F5 - A5 - C6 - D6 - C6 - A5 - |
pat leadT  = B5 - - - G5 - - - D5 - - - . . . .

part intro = kick:four hat:hats bass:bassI arp:arpI
part A     = kick:four snare:back hat:hats bass:bassA arp:arpA lead:leadA
part A2    = kick:four snare:back hat:hats16 bass:bassA arp:arpA lead:leadA2
part B     = kick:synco snare:back hat:hats bass:bassB pad:padHi pad:padLo lead:leadB
part tag   = kick:four snare:tagsn hat:hats16 bass:bassT arp:arpT lead:leadT
order      = intro A A2 B tag

; the four menu screens share the piece (the originals sound alike), a
; screen can get its own song or changes, e.g. "tempo=0.94" or "order=B tag"
[music:mainmenu_sound]
song=menu

[music:join_sound]
song=menu

[music:player_setup_sound]
song=menu

[music:draw]
song=menu
